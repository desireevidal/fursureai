name: fursure
description: "Predict cat breed from images and cat gender from audio using on-device ML."
publish_to: 'none'

version: 1.0.0+15

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.4
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  tflite_flutter: ^0.12.1
  camera: ^0.12.0
  image_picker: ^1.1.2
  record: ^6.2.0
  dio: ^5.7.0
  path_provider: ^2.1.5
  image: ^4.5.3
  permission_handler: ^12.0.1
  dartz: ^0.10.1
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.2
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.3
  ffmpeg_kit_flutter_new_audio: ^2.0.0
  audioplayers: ^6.1.0
  file_picker: ^10.3.10
  package_info_plus: ^9.0.0
  archive: ^4.0.9
  share_plus: ^10.1.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

dependency_overrides:
  _fe_analyzer_shared: ^97.0.0
  analyzer: ^11.0.0
  matcher: ^0.12.19
  meta: ^1.18.1
  test: ^1.30.0
  test_api: ^0.7.10
  test_core: ^0.6.16

flutter_native_splash:
  color: "#7E1891"
  image: assets/images/splash.png
  android_12:
    color: "#7E1891"
    image: assets/images/splash.png
    icon_background_color: "#7E1891"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/breed_info/
    - assets/images/breed_info_cropped/
